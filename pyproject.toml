[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verticalparts-infrastructure-mcp"
version = "0.1.0"
description = "MCP corporativo de infraestrutura da VerticalParts"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.2.0,<2",
  "httpx>=0.27",
  "asyncssh>=2.17",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
]

[project.scripts]
verticalparts-infra-mcp = "verticalparts_infra_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/verticalparts_infra_mcp"]
