version: 1
# Exemplo sem segredos. Copie para config/inventory.yaml no ambiente real.
environments:
  vps:
    provider: hostinger
    vm_id: "CHANGE_ME"
    role: production
  shared_hosting:
    provider: hostinger
    role: production

domains:
  example.vpsistema.com:
    environment: shared_hosting
    status: production
    source_of_truth: dns
    notes: []

  migrated-example.vpsistema.com:
    environment: vps
    status: production
    source_of_truth: dns
    notes:
      - migrated_from_shared_hosting

  legacy-example.vpsistema.com:
    environment: shared_hosting
    status: legacy
    source_of_truth: reconciled
    notes:
      - cadastro_legado_nao_define_producao
      - nao_remover_sem_validar_dns_runtime_health

aliases: {}

# Regras:
# - website Hostinger cadastrado não prova produção;
# - DNS + runtime + health + inventory reconciliado definem o ambiente real;
# - website_type=other não deve ser traduzido automaticamente para PHP.
